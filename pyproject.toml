[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-with-python-demo"
version = "0.1.0"
description = "Example project for building AI agents with LangChain, FastAPI, FastMCP, DuckDB, and Streamlit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=0.2.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "streamlit>=1.40.0",
    "tabulate>=0.9.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
